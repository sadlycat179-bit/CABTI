<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="CATBTI 校园猫人格测试">
  <title>CATBTI · 校园猫人格测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <button class="brand" type="button" data-route="home" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span class="brand-name" data-content="site.shortName"></span>
    </button>
    <button class="icon-button" id="galleryShortcut" type="button" aria-label="打开猫咪图鉴" title="猫咪图鉴">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V6.8C4 5.8 4.8 5 5.8 5H18a2 2 0 0 1 2 2v12.5M7 5V3.5M17 5V3.5M3 19.5h18M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg>
    </button>
  </header>

  <main id="app" tabindex="-1">
    <section class="view home-view is-active" id="homeView" aria-labelledby="homeTitle">
      <div class="hero-copy">
        <div class="eyebrow"><span class="mini-paw" aria-hidden="true">●</span><span data-content="site.eyebrow"></span></div>
        <h1 id="homeTitle"><span data-content="site.name"></span><small data-content="site.subtitle"></small></h1>
        <p class="hero-intro" data-content="site.intro"></p>
        <div class="hero-actions">
          <button class="button button-primary" id="startButton" type="button">
            <span data-content="site.startButton"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button class="button button-secondary" id="showCatsButton" type="button" data-content="site.galleryButton"></button>
        </div>
        <div class="quick-facts" id="quickFacts"></div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="sun-disc"></div>
        <div class="hero-cat">
          <div class="hero-ear hero-ear-left"></div><div class="hero-ear hero-ear-right"></div>
          <div class="hero-head"><i class="eye eye-left"></i><i class="eye eye-right"></i><i class="nose"></i><i class="mouth"></i></div>
          <div class="hero-body"><span class="stripe s1"></span><span class="stripe s2"></span></div>
          <div class="hero-tail"></div>
        </div>
        <span class="float-fish">&lt;°)))彡</span>
        <span class="float-paw paw-a">●</span>
        <span class="float-paw paw-b">●</span>
        <div class="campus-line"></div>
      </div>
    </section>

    <section class="view test-view" id="testView" aria-labelledby="questionTitle">
      <div class="test-shell">
        <div class="test-topline">
          <button class="back-button" id="testBackButton" type="button" aria-label="返回上一题" title="返回上一题">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="progress-copy"><span id="progressLabel"></span><strong id="progressPercent"></strong></div>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        <article class="question-panel" id="questionPanel">
          <div class="question-number" id="questionNumber"></div>
          <h2 id="questionTitle"></h2>
          <p id="questionHint"></p>
          <div class="option-list" id="optionList" role="radiogroup"></div>
        </article>
        <p class="test-note" data-content="site.testNote"></p>
      </div>
    </section>

    <section class="view result-view" id="resultView" aria-labelledby="resultType">
      <div class="result-shell">
        <div class="result-heading">
          <span class="eyebrow" data-content="site.resultEyebrow"></span>
          <h2 id="resultType"></h2>
          <p id="resultTitle"></p>
        </div>
        <div class="result-layout">
          <div class="result-portrait-wrap">
            <img id="resultImage" src="" alt="">
            <span class="type-stamp" id="resultStamp"></span>
          </div>
          <div class="result-copy">
            <div class="cat-identity">
              <div class="cat-name-line"><span data-content="site.yourCatLabel"></span><strong id="resultCatName"></strong></div>
              <span class="mbti-badge" id="resultMbti"></span>
            </div>
            <section class="result-story" aria-labelledby="catStoryTitle">
              <h3 id="catStoryTitle">猫咪小传</h3>
              <p id="resultBiography"></p>
            </section>
            <section class="result-personality" aria-labelledby="personalityTitle">
              <h3 id="personalityTitle">你可能是</h3>
              <p id="resultPersonality"></p>
            </section>
            <div class="keyword-list" id="resultKeywords" aria-label="性格关键词"></div>
            <blockquote id="resultQuote"></blockquote>
          </div>
        </div>
        <div class="claim-notice"><span class="notice-paw" aria-hidden="true">●</span><p data-content="site.claimNotice"></p></div>
        <div class="result-actions">
          <button class="button button-primary" id="retryButton" type="button" data-content="site.retryButton"></button>
          <button class="button button-secondary" id="resultGalleryButton" type="button" data-content="site.galleryButton"></button>
        </div>
      </div>
    </section>

    <section class="view gallery-view" id="galleryView" aria-labelledby="galleryTitle">
      <div class="gallery-heading">
        <span class="eyebrow" data-content="site.galleryEyebrow"></span>
        <h2 id="galleryTitle" data-content="site.galleryTitle"></h2>
        <p data-content="site.galleryIntro"></p>
      </div>
      <div class="cat-grid" id="catGrid"></div>
    </section>
  </main>

  <footer><span data-content="site.footer"></span></footer>

  <dialog class="cat-dialog" id="catDialog">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭" title="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
